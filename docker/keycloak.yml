services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Feature flag verified against 26.7: the native SCIM feature is "scim-api"
      KC_FEATURES: scim-api
    ports:
      - "8080:8080"
